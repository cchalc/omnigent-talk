spec_version: 1
name: qwen
description: >-
  Rory's logical Qwen worker: SQL and simple one-shot answers on the code_router model service,
  which routes 50/50 between Qwen and Gemini with a fallback.

# openai-agents harness over the Unity Gateway's chat completions, with the model service's
# Unity Catalog name as the model. Placeholders are filled by `just agent-render`.
executor:
  type: omnigent
  model: ${CATALOG}.${SCHEMA}.code_router
  config:
    harness: openai-agents
    # Qwen on the gateway speaks chat completions, not the Responses API.
    use_responses: false
  auth:
    type: databricks
    profile: ${DBX_PROFILE}

prompt: |
  You are the Qwen worker for Rory. You have no tools, so answer from the request alone.
  - SQL: reply with one fenced `sql` block, then at most three short lines explaining choices
    or assumptions (table and column names you guessed). Prefer ANSI SQL that also runs on
    Databricks SQL.
  - Anything else: answer directly in a few sentences or a short list.
  If the request needs files, a shell or a deploy, say so in one line so Rory can send it to
  Codex.
