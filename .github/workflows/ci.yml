name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One job per check, so a failure points at its cause. All of them run with no
# Databricks credentials: anything that reaches a workspace sits behind a test seam.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: extractions/setup-just@v4
      - run: just install
      - run: just lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: extractions/setup-just@v4
      - run: just install
      - run: just test

  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash scripts/check.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: shellcheck scripts/*.sh
