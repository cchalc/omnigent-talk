[project]
name = "omnigent-talk"
version = "0.1.0"
description = "Demo automation for the Omnigent meta-harness talk: Unity Gateway model services, agy, agent memory, Databricks Sandbox"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "databricks-sdk>=0.80",
  "httpx>=0.28",
  "starlette>=0.47",
  "uvicorn>=0.35",
]

[project.optional-dependencies]
# Managed agent memory (Beta). Kept optional so `just test` never needs it.
memory = ["databricks-agentbricks>=0.6.0"]

[project.scripts]
omnigent-talk = "omnigent_talk.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pyright>=1.1.411",
  "ruff>=0.16",
  "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnigent_talk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501"]  # line length is the formatter's job

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
